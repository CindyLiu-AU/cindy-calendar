<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cindy Calendar">
  <title>Cindy Calendar</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #0d1b2a;
      --surface: #112240;
      --border:  #1e3a5f;
      --text:    #f0f4f8;
      --muted:   #64748b;
      --dim:     #334d66;
      --amber:   #f59e0b;
      --blue:    #3b82f6;
      --green:   #22c55e;
      --red:     #ef4444;
      --purple:  #a855f7;
    }
    html[data-theme="light"] {
      --bg:      #f0f6ff;
      --surface: #ffffff;
      --border:  #c5d8f0;
      --text:    #0f1f35;
      --muted:   #475569;
      --dim:     #94a3b8;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100svh;
      max-width: 520px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    /* ── Header ── */
    #header {
      position: sticky; top: 0; z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px 0;
      padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
    }
    .hrow { display: flex; align-items: center; gap: 8px; }
    .hrow h1 { flex: 1; font-size: 19px; font-weight: 900; color: var(--amber); }
    .hbtn {
      background: var(--surface); border: 2px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 13px; font-weight: 700; font-family: inherit;
      padding: 6px 11px; cursor: pointer; flex-shrink: 0;
    }
    .hbtn:active { opacity: 0.7; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 6px; margin-top: 10px; padding-bottom: 10px; }
    .tab {
      flex: 1; padding: 8px 0; border-radius: 10px; border: 2px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer; text-align: center;
    }
    .tab.active { background: var(--amber); border-color: var(--amber); color: #1a1000; }

    /* ── TIMELINE ── */
    #timeline-panel { padding: 12px 14px; }

    .tl-day { margin-bottom: 22px; }

    .tl-day-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px;
    }
    .tl-day-line { flex: 1; height: 1px; background: var(--border); }
    .tl-day-label {
      font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); flex-shrink: 0;
    }
    .tl-day-label.is-today { color: var(--amber); }
    .tl-day-label.is-overdue { color: var(--red); }
    .tl-add-btn {
      background: none; border: 1.5px solid var(--dim); border-radius: 8px;
      color: var(--dim); font-size: 12px; font-weight: 800; padding: 2px 8px;
      font-family: inherit; cursor: pointer; flex-shrink: 0;
    }
    .tl-add-btn:active { opacity: 0.7; }

    /* Task card */
    .task-card {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 10px 12px; margin-bottom: 6px;
    }
    .task-card.done-card { opacity: 0.45; }

    .task-color-bar {
      width: 4px; min-height: 36px; border-radius: 2px; flex-shrink: 0; align-self: stretch;
    }
    .task-info { flex: 1; min-width: 0; }
    .task-time-lbl {
      font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 2px;
    }
    .task-title-txt {
      font-size: 15px; font-weight: 700; color: var(--text);
      word-break: break-word; line-height: 1.3;
    }
    .task-title-txt.done-txt { text-decoration: line-through; color: var(--muted); }

    .task-done-btn {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid var(--border); background: none;
      flex-shrink: 0; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 13px; color: transparent;
    }
    .task-done-btn.is-done { background: var(--green); border-color: var(--green); color: #fff; }
    .task-done-btn:active { opacity: 0.7; }

    .task-del-btn {
      background: none; border: none; color: var(--dim); font-size: 18px;
      cursor: pointer; padding: 0 2px; line-height: 1; flex-shrink: 0;
    }
    .task-del-btn:active { color: var(--red); }

    /* ── Countdown badge ── */
    .countdown-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 800; border-radius: 20px;
      padding: 2px 8px; margin-top: 4px; width: fit-content;
    }
    .countdown-badge.urgent  { background: rgba(239,68,68,0.15);  color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
    .countdown-badge.warning { background: rgba(245,158,11,0.15); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
    .countdown-badge.ok      { background: rgba(59,130,246,0.12); color: var(--blue);  border: 1px solid rgba(59,130,246,0.25); }
    .countdown-badge.done    { background: rgba(34,197,94,0.12);  color: var(--green); border: 1px solid rgba(34,197,94,0.25); }

    .tl-empty {
      text-align: center; color: var(--muted);
      padding: 60px 20px; font-size: 15px; line-height: 1.8;
    }
    .tl-empty-icon { font-size: 48px; display: block; margin-bottom: 10px; }

    /* ── CALENDAR ── */
    #calendar-panel { display: none; padding: 12px 14px; }

    .cal-nav {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .cal-nav h2 { flex: 1; text-align: center; font-size: 17px; font-weight: 800; }
    .cal-nav-btn {
      background: var(--surface); border: 2px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 15px; padding: 4px 10px; cursor: pointer;
      font-family: inherit;
    }
    .cal-nav-btn:active { opacity: 0.7; }

    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
    }
    .cal-dow {
      text-align: center; font-size: 10px; font-weight: 800;
      color: var(--muted); text-transform: uppercase; padding: 5px 0 3px;
    }
    .cal-cell {
      aspect-ratio: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-radius: 10px; cursor: pointer; gap: 2px;
      background: var(--surface); border: 1.5px solid var(--border);
    }
    .cal-cell:active { opacity: 0.7; }
    .cal-cell.empty { background: none; border-color: transparent; cursor: default; }
    .cal-cell.is-today { border-color: var(--amber); background: rgba(245,158,11,0.1); }
    .cal-cell.is-past .cal-dn { color: var(--muted); }
    .cal-cell.is-today .cal-dn { color: var(--amber); }
    .cal-dn { font-size: 14px; font-weight: 700; }
    .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

    /* ── DAY PANEL (bottom sheet) ── */
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 200;
    }
    #overlay.open { display: block; }

    #day-sheet {
      position: fixed; bottom: 0; left: 50%;
      transform: translateX(-50%) translateY(101%);
      width: 100%; max-width: 520px;
      background: var(--bg); border-radius: 22px 22px 0 0;
      border: 1.5px solid var(--border); border-bottom: none;
      z-index: 300;
      max-height: 82svh; display: flex; flex-direction: column;
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    }
    #day-sheet.open { transform: translateX(-50%) translateY(0); }

    .sheet-handle {
      width: 38px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 12px auto 0; flex-shrink: 0;
    }
    .sheet-head {
      display: flex; align-items: center; padding: 12px 16px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .sheet-head-date { flex: 1; font-size: 16px; font-weight: 800; }
    .sheet-close {
      background: none; border: none; color: var(--muted);
      font-size: 22px; cursor: pointer; padding: 0 2px; line-height: 1;
    }

    #sheet-task-list { flex: 1; overflow-y: auto; padding: 10px 14px 4px; }

    .sheet-no-tasks {
      text-align: center; color: var(--muted); padding: 24px 0; font-size: 14px;
    }

    #sheet-add-form {
      border-top: 1px solid var(--border);
      padding: 10px 14px; display: flex; flex-direction: column; gap: 8px;
      flex-shrink: 0;
    }
    .form-row { display: flex; gap: 8px; }
    .form-input {
      background: var(--surface); border: 2px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 15px;
      font-family: inherit; padding: 9px 12px; outline: none;
    }
    .form-input:focus { border-color: var(--amber); }
    #f-title { flex: 1; }
    #f-time { width: 96px; flex-shrink: 0; }

    .color-row { display: flex; gap: 7px; align-items: center; flex: 1; }
    .cswatch {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid transparent; cursor: pointer;
      transition: transform 0.12s;
    }
    .cswatch.picked { border-color: white; transform: scale(1.2); }
    html[data-theme="light"] .cswatch.picked { border-color: #1a1000; }

    .form-save-btn {
      padding: 9px 18px; border-radius: 10px; border: none;
      background: var(--amber); color: #1a1000;
      font-size: 14px; font-weight: 800; font-family: inherit; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .form-save-btn:active { opacity: 0.8; }

    /* ── FAB ── */
    #fab {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
      right: 22px;
      width: 58px; height: 58px;
      border-radius: 50%; border: none;
      background: var(--amber); color: #1a1000;
      font-size: 30px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px rgba(245,158,11,0.45);
      z-index: 100; transition: transform 0.15s;
    }
    #fab:active { transform: scale(0.93); }
  </style>
</head>
<body>

<div id="header">
  <div class="hrow">
    <h1>✨ Cindy Calendar</h1>
    <button class="hbtn" onclick="toggleTheme()">☀️</button>
  </div>
  <div class="tabs">
    <button class="tab" id="tab-tl" onclick="showTab('timeline')">📋 Timeline</button>
    <button class="tab" id="tab-cal" onclick="showTab('calendar')">📅 Calendar</button>
  </div>
</div>

<div id="timeline-panel"></div>
<div id="calendar-panel"></div>

<!-- Day bottom sheet -->
<div id="overlay" onclick="closeSheet()"></div>
<div id="day-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-head-date" id="sheet-date-label"></div>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
  </div>
  <div id="sheet-task-list"></div>
  <div id="sheet-add-form">
    <div class="form-row">
      <input class="form-input" id="f-title" placeholder="Add a reminder…"
             onkeydown="if(event.key==='Enter')saveTask()" />
      <input class="form-input" id="f-time" type="time" />
    </div>
    <div class="form-row">
      <div class="color-row" id="color-swatches"></div>
      <button class="form-save-btn" onclick="saveTask()">＋ Add</button>
    </div>
  </div>
</div>

<button id="fab" onclick="openSheet(todayStr())">＋</button>

<script>
  const FB = 'https://parents-reminder-places-default-rtdb.asia-southeast1.firebasedatabase.app/cindy-calendar.json';
  const THEME_KEY = 'cc_theme';

  const COLORS = {
    blue:   '#3b82f6',
    amber:  '#f59e0b',
    green:  '#22c55e',
    red:    '#ef4444',
    purple: '#a855f7',
  };

  let tasks       = [];
  let activeTab   = 'timeline';
  let calYear     = new Date().getFullYear();
  let calMonth    = new Date().getMonth();
  let sheetDate   = null;
  let pickedColor = 'blue';

  // ── Theme ──
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem(THEME_KEY, t);
  }
  function toggleTheme() {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  }
  applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

  // ── Dates ──
  function todayStr() { return new Date().toISOString().slice(0, 10); }

  function dayLabel(dateStr) {
    const today = todayStr();
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
    const tomStr = tomorrow.toISOString().slice(0, 10);
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
    const yestStr = yesterday.toISOString().slice(0, 10);
    if (dateStr === today)   return { text: 'TODAY',     cls: 'is-today' };
    if (dateStr === tomStr)  return { text: 'TOMORROW',  cls: '' };
    if (dateStr === yestStr) return { text: 'YESTERDAY', cls: 'is-overdue' };
    const d = new Date(dateStr + 'T00:00:00');
    const past = dateStr < today;
    const text = d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
    return { text, cls: past ? 'is-overdue' : '' };
  }

  function fmtFull(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  // ── Firebase ──
  async function loadTasks() {
    try {
      const r = await fetch(FB + '?t=' + Date.now(), { cache: 'no-store' });
      const d = await r.json();
      tasks = Array.isArray(d) ? d : [];
    } catch { tasks = []; }
    sortTasks();
    render();
  }

  async function pushTasks() {
    await fetch(FB, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tasks) });
  }

  function sortTasks() {
    tasks.sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      if (!a.time && !b.time) return 0;
      if (!a.time) return 1;
      if (!b.time) return -1;
      return a.time < b.time ? -1 : 1;
    });
  }

  // ── CRUD ──
  async function saveTask() {
    const title = document.getElementById('f-title').value.trim();
    if (!title || !sheetDate) return;
    const time = document.getElementById('f-time').value;
    tasks.push({ id: 't' + Date.now(), date: sheetDate, title, time: time || '', done: false, color: pickedColor });
    sortTasks();
    document.getElementById('f-title').value = '';
    document.getElementById('f-time').value = '';
    await pushTasks();
    renderSheet(sheetDate);
    render();
  }

  async function toggleDone(id) {
    const t = tasks.find(x => x.id === id);
    if (t) t.done = !t.done;
    await pushTasks();
    if (sheetDate) renderSheet(sheetDate);
    render();
  }

  async function deleteTask(id) {
    if (!confirm('Delete this reminder?')) return;
    tasks = tasks.filter(x => x.id !== id);
    await pushTasks();
    if (sheetDate) renderSheet(sheetDate);
    render();
  }

  // ── Task card HTML ──
  function countdownBadge(t) {
    if (!t.deadline) return '';
    const dl = new Date(t.deadline + 'T00:00:00');
    const now = new Date(todayStr() + 'T00:00:00');
    const days = Math.ceil((dl - now) / 86400000);
    if (t.done) return `<div class="countdown-badge done">✓ Done — deadline was ${t.deadline}</div>`;
    if (days < 0)  return `<div class="countdown-badge urgent">⚠ Overdue by ${Math.abs(days)} day${Math.abs(days)>1?'s':''}</div>`;
    if (days === 0) return `<div class="countdown-badge urgent">⚠ Due TODAY</div>`;
    if (days === 1) return `<div class="countdown-badge urgent">⚠ Due TOMORROW</div>`;
    if (days <= 7)  return `<div class="countdown-badge urgent">🔴 ${days} days left — ${t.deadline}</div>`;
    if (days <= 14) return `<div class="countdown-badge warning">🟡 ${days} days left — ${t.deadline}</div>`;
    return `<div class="countdown-badge ok">🔵 ${days} days left — ${t.deadline}</div>`;
  }

  function taskCardHTML(t) {
    const col = COLORS[t.color] || COLORS.blue;
    const timeLbl = t.time || 'All day';
    return `<div class="task-card${t.done ? ' done-card' : ''}">
      <div class="task-color-bar" style="background:${col}"></div>
      <div class="task-info">
        <div class="task-time-lbl">${timeLbl}</div>
        <div class="task-title-txt${t.done ? ' done-txt' : ''}">${escHtml(t.title)}</div>
        ${countdownBadge(t)}
      </div>
      <button class="task-done-btn${t.done ? ' is-done' : ''}" onclick="toggleDone('${t.id}')">${t.done ? '✓' : ''}</button>
      <button class="task-del-btn" onclick="deleteTask('${t.id}')">×</button>
    </div>`;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Render ──
  function render() {
    if (activeTab === 'timeline') renderTimeline();
    else renderCalendar();
  }

  function renderTimeline() {
    const el = document.getElementById('timeline-panel');
    const today = todayStr();
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
    const cutoffStr = cutoff.toISOString().slice(0, 10);
    const ahead = new Date(); ahead.setDate(ahead.getDate() + 90);
    const aheadStr = ahead.toISOString().slice(0, 10);

    // Group by date, filter window
    const grouped = {};
    for (const t of tasks) {
      if (t.date < cutoffStr || t.date > aheadStr) continue;
      // include past dates only if they have incomplete tasks
      if (t.date < today && t.done) continue;
      if (!grouped[t.date]) grouped[t.date] = [];
      grouped[t.date].push(t);
    }

    const dates = Object.keys(grouped).sort();
    if (!dates.length) {
      el.innerHTML = `<div class="tl-empty">
        <span class="tl-empty-icon">📅</span>
        No upcoming reminders<br>Tap <strong>＋</strong> to add one!
      </div>`;
      return;
    }

    el.innerHTML = dates.map(date => {
      const { text, cls } = dayLabel(date);
      const d = new Date(date + 'T00:00:00');
      const sub = d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
      const displayLabel = cls === 'is-today' ? `TODAY · ${sub}` :
                           cls === 'is-overdue' ? `⚠ ${text} · ${sub}` :
                           text === 'TOMORROW' ? `TOMORROW · ${sub}` : text + ' · ' + sub;

      return `<div class="tl-day">
        <div class="tl-day-header">
          <span class="tl-day-label ${cls}">${displayLabel}</span>
          <div class="tl-day-line"></div>
          <button class="tl-add-btn" onclick="openSheet('${date}')">＋</button>
        </div>
        ${grouped[date].map(taskCardHTML).join('')}
      </div>`;
    }).join('');
  }

  function renderCalendar() {
    const el = document.getElementById('calendar-panel');
    const today = todayStr();
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DOW = ['M','T','W','T','F','S','S'];

    const firstDow = new Date(calYear, calMonth, 1).getDay();
    const offset = (firstDow + 6) % 7;
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const mk = `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;

    const byDate = {};
    tasks.filter(t => t.date.startsWith(mk)).forEach(t => {
      byDate[t.date] = (byDate[t.date] || []).concat(t);
    });

    const cells = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('') +
      Array(offset).fill('<div class="cal-cell empty"></div>').join('') +
      Array.from({ length: daysInMonth }, (_, i) => {
        const d = i + 1;
        const ds = `${mk}-${String(d).padStart(2, '0')}`;
        const isToday = ds === today;
        const isPast = ds < today;
        const dayTasks = byDate[ds] || [];
        const dots = dayTasks.slice(0, 4).map(t =>
          `<div class="cal-dot" style="background:${COLORS[t.color]||COLORS.blue}"></div>`
        ).join('');
        return `<div class="cal-cell${isToday ? ' is-today' : isPast ? ' is-past' : ''}" onclick="openSheet('${ds}')">
          <span class="cal-dn">${d}</span>
          <div class="cal-dots">${dots}</div>
        </div>`;
      }).join('');

    el.innerHTML = `<div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrev()">◀</button>
      <h2>${MONTHS[calMonth]} ${calYear}</h2>
      <button class="cal-nav-btn" onclick="calNext()">▶</button>
    </div>
    <div class="cal-grid">${cells}</div>`;
  }

  // ── Day sheet ──
  function openSheet(dateStr) {
    sheetDate = dateStr;
    document.getElementById('sheet-date-label').textContent = fmtFull(dateStr);
    document.getElementById('f-title').value = '';
    document.getElementById('f-time').value = '';
    renderColorSwatches();
    renderSheet(dateStr);
    document.getElementById('overlay').classList.add('open');
    document.getElementById('day-sheet').classList.add('open');
    setTimeout(() => document.getElementById('f-title').focus(), 350);
  }

  function closeSheet() {
    sheetDate = null;
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('day-sheet').classList.remove('open');
  }

  function renderSheet(dateStr) {
    const el = document.getElementById('sheet-task-list');
    const dayTasks = tasks.filter(t => t.date === dateStr);
    el.innerHTML = dayTasks.length
      ? dayTasks.map(taskCardHTML).join('')
      : '<div class="sheet-no-tasks">No reminders — add one below</div>';
  }

  function renderColorSwatches() {
    document.getElementById('color-swatches').innerHTML = Object.entries(COLORS).map(([name, hex]) =>
      `<div class="cswatch${pickedColor === name ? ' picked' : ''}"
        style="background:${hex}" onclick="pickColor('${name}')"></div>`
    ).join('');
  }

  function pickColor(name) {
    pickedColor = name;
    renderColorSwatches();
  }

  // ── Tabs ──
  function showTab(tab) {
    activeTab = tab;
    document.getElementById('tab-tl').classList.toggle('active', tab === 'timeline');
    document.getElementById('tab-cal').classList.toggle('active', tab === 'calendar');
    document.getElementById('timeline-panel').style.display = tab === 'timeline' ? 'block' : 'none';
    document.getElementById('calendar-panel').style.display = tab === 'calendar' ? 'block' : 'none';
    render();
  }

  // ── Calendar nav ──
  function calPrev() { if (--calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
  function calNext() { if (++calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }

  // ── Init ──
  showTab('timeline');
  loadTasks();
</script>
</body>
</html>
