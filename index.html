<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cindy Calendar">
  <title>Cindy Calendar</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #0d1b2a;
      --surface: #112240;
      --border:  #1e3a5f;
      --text:    #f0f4f8;
      --muted:   #64748b;
      --dim:     #334d66;
      --amber:   #f59e0b;
      --blue:    #3b82f6;
      --green:   #22c55e;
      --red:     #ef4444;
      --purple:  #a855f7;
    }
    html[data-theme="light"] {
      --bg:      #f0f6ff; --surface: #ffffff; --border: #c5d8f0;
      --text:    #0f1f35; --muted:   #475569; --dim:    #94a3b8;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100svh; max-width: 520px; margin: 0 auto;
      overflow-x: hidden;
    }

    /* ── Header ── */
    #header {
      position: sticky; top: 0; z-index: 50;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: calc(env(safe-area-inset-top,0px) + 10px) 14px 0;
    }
    .hrow { display: flex; align-items: center; gap: 8px; }
    .hrow h1 { flex: 1; font-size: 19px; font-weight: 900; color: var(--amber); }
    .hbtn {
      background: var(--surface); border: 2px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 13px; font-weight: 700; font-family: inherit;
      padding: 6px 11px; cursor: pointer;
    }
    .hbtn:active { opacity: .7; }

    .tabs { display: flex; gap: 5px; margin-top: 10px; padding-bottom: 8px; }
    .tab {
      flex: 1; padding: 7px 0; border-radius: 10px; border: 2px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer; text-align: center;
    }
    .tab.active { background: var(--amber); border-color: var(--amber); color: #1a1000; }

    /* ── Category filter bar ── */
    #filter-bar {
      display: flex; gap: 5px; padding: 6px 14px 10px;
      overflow-x: auto; scrollbar-width: none;
    }
    #filter-bar::-webkit-scrollbar { display: none; }
    .fp {
      padding: 4px 11px; border-radius: 20px; border: 2px solid transparent;
      font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap;
      font-family: inherit; flex-shrink: 0; transition: opacity .15s;
    }
    .fp.off { opacity: .28; text-decoration: line-through; }
    .fp-all {
      padding: 4px 11px; border-radius: 20px;
      border: 2px solid var(--border); background: var(--surface);
      color: var(--muted); font-size: 11px; font-weight: 800;
      cursor: pointer; white-space: nowrap; font-family: inherit; flex-shrink: 0;
    }
    .fp-all.active { border-color: var(--amber); color: var(--amber); }

    /* ══════════════════════════════════════════
       VISUAL TIMELINE
    ══════════════════════════════════════════ */
    #visual-panel {
      padding: 10px 0 100px;
      overflow-y: auto;
    }

    #vt-wrap {
      position: relative;
      width: 100%;
      /* height set by JS */
    }

    /* centre vertical line — top/height set by JS so it only spans actual tasks */
    .vt-line {
      position: absolute;
      left: 50%;
      width: 3px;
      background: var(--dim);
      border-radius: 2px;
      transform: translateX(-50%);
    }

    /* dot on the line per date */
    .vt-dot {
      position: absolute;
      left: 50%; transform: translate(-50%, -50%);
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--surface); border: 2.5px solid var(--dim);
      z-index: 6;
    }
    .vt-dot.is-today {
      width: 16px; height: 16px;
      background: var(--amber); border-color: var(--amber);
      box-shadow: 0 0 0 5px rgba(245,158,11,.2);
    }

    /* date label beside the dot */
    .vt-lbl {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      font-size: 9px; font-weight: 900; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em;
      white-space: nowrap; background: var(--bg); padding: 0 5px;
      z-index: 7;
    }
    .vt-lbl.is-today { color: var(--amber); }
    .vt-lbl.is-overdue { color: var(--red); }

    /* ── Bubble ── */
    .vt-bubble {
      position: absolute;
      width: calc(50% - 30px);
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      display: flex; align-items: stretch;
      cursor: grab;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
      z-index: 10;
      transition: box-shadow .15s, border-color .15s;
    }
    .vt-bubble:active { cursor: grabbing; }
    .vt-bubble.vt-dragging {
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
      border-color: var(--blue);
      z-index: 100;
    }

    /* horizontal connector to the line */
    .vt-bubble::after {
      content: '';
      position: absolute; top: 50%;
      height: 2px; background: var(--border);
      pointer-events: none;
    }
    .vt-bubble.left  { right: calc(50% + 22px); border-radius: 12px 12px 12px 3px; }
    .vt-bubble.right { left:  calc(50% + 22px); border-radius: 12px 12px 3px 12px; }
    .vt-bubble.left::after  { left: 100%;  width: 22px; }
    .vt-bubble.right::after { right: 100%; width: 22px; }

    .vt-bar {
      width: 5px; flex-shrink: 0; border-radius: 11px 0 0 11px;
    }
    .vt-bubble.right .vt-bar { border-radius: 0 11px 11px 0; order: 2; }

    .vt-body {
      flex: 1; padding: 9px 8px; min-width: 0;
    }
    .vt-title {
      font-size: 13px; font-weight: 700; color: var(--text);
      line-height: 1.35; word-break: break-word;
    }
    .vt-grip {
      font-size: 11px; color: var(--dim); padding: 8px 6px;
      letter-spacing: -2px; flex-shrink: 0; display: flex;
      align-items: center;
    }

    /* countdown badge inside bubble */
    .vt-badge {
      display: inline-block; margin-top: 4px;
      font-size: 10px; font-weight: 800;
      border-radius: 20px; padding: 2px 7px;
    }
    .vt-badge.urgent  { background: rgba(239,68,68,.15);  color: var(--red);    border: 1px solid rgba(239,68,68,.3); }
    .vt-badge.warning { background: rgba(245,158,11,.15); color: var(--amber);  border: 1px solid rgba(245,158,11,.3); }
    .vt-badge.ok      { background: rgba(59,130,246,.12); color: var(--blue);   border: 1px solid rgba(59,130,246,.25); }
    .vt-badge.good    { background: rgba(34,197,94,.12);  color: var(--green);  border: 1px solid rgba(34,197,94,.25); }

    /* drag date preview pill */
    #drag-preview {
      display: none; position: fixed;
      bottom: 110px; left: 50%; transform: translateX(-50%);
      background: var(--amber); color: #1a1000;
      padding: 7px 20px; border-radius: 22px;
      font-size: 13px; font-weight: 800;
      z-index: 1000; pointer-events: none; white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
    }

    .vt-empty {
      text-align: center; color: var(--muted);
      padding: 80px 24px; font-size: 15px; line-height: 1.8;
    }
    .vt-empty-icon { font-size: 50px; display: block; margin-bottom: 12px; }

    /* ══════════════════════════════════════════
       LIST TIMELINE (secondary tab)
    ══════════════════════════════════════════ */
    #list-panel { padding: 12px 14px; display: none; }

    .tl-day { margin-bottom: 22px; }
    .tl-day-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .tl-day-line { flex: 1; height: 1px; background: var(--border); }
    .tl-day-label {
      font-size: 11px; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted); flex-shrink: 0;
    }
    .tl-day-label.is-today   { color: var(--amber); }
    .tl-day-label.is-overdue { color: var(--red); }
    .tl-add-btn {
      background: none; border: 1.5px solid var(--dim); border-radius: 8px;
      color: var(--dim); font-size: 12px; font-weight: 800;
      padding: 2px 8px; font-family: inherit; cursor: pointer; flex-shrink: 0;
    }
    .tl-add-btn:active { opacity: .7; }

    .task-card {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 10px 12px; margin-bottom: 6px;
    }
    .task-card.done-card { opacity: .45; }
    .task-color-bar { width: 4px; min-height: 36px; border-radius: 2px; flex-shrink: 0; align-self: stretch; }
    .task-info { flex: 1; min-width: 0; }
    .task-time-lbl { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
    .task-title-txt { font-size: 15px; font-weight: 700; color: var(--text); word-break: break-word; line-height: 1.3; }
    .task-title-txt.done-txt { text-decoration: line-through; color: var(--muted); }
    .task-done-btn {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid var(--border); background: none;
      flex-shrink: 0; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 13px; color: transparent;
    }
    .task-done-btn.is-done { background: var(--green); border-color: var(--green); color: #fff; }
    .task-del-btn { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; padding: 0 2px; line-height: 1; }
    .task-del-btn:active { color: var(--red); }

    .countdown-badge {
      display: inline-block; font-size: 11px; font-weight: 800;
      border-radius: 20px; padding: 2px 8px; margin-top: 4px;
    }
    .countdown-badge.urgent  { background: rgba(239,68,68,.15);  color: var(--red);   border: 1px solid rgba(239,68,68,.3); }
    .countdown-badge.warning { background: rgba(245,158,11,.15); color: var(--amber); border: 1px solid rgba(245,158,11,.3); }
    .countdown-badge.ok      { background: rgba(59,130,246,.12); color: var(--blue);  border: 1px solid rgba(59,130,246,.25); }
    .countdown-badge.good    { background: rgba(34,197,94,.12);  color: var(--green); border: 1px solid rgba(34,197,94,.25); }

    .tl-empty {
      text-align: center; color: var(--muted); padding: 60px 20px; font-size: 15px; line-height: 1.8;
    }
    .tl-empty-icon { font-size: 48px; display: block; margin-bottom: 10px; }

    /* ══════════════════════════════════════════
       CALENDAR
    ══════════════════════════════════════════ */
    #calendar-panel { display: none; padding: 12px 14px; }
    .cal-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .cal-nav h2 { flex: 1; text-align: center; font-size: 17px; font-weight: 800; }
    .cal-nav-btn {
      background: var(--surface); border: 2px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 15px; padding: 4px 10px; cursor: pointer; font-family: inherit;
    }
    .cal-nav-btn:active { opacity: .7; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow { text-align: center; font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; padding: 5px 0 3px; }
    .cal-cell {
      aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 10px; cursor: pointer; gap: 2px; padding: 3px;
      background: var(--surface); border: 1.5px solid var(--border);
    }
    .cal-cell:active { opacity: .7; }
    .cal-cell.empty { background: none; border-color: transparent; cursor: default; }
    .cal-cell.is-today { border-color: var(--amber); background: rgba(245,158,11,.1); }
    .cal-cell.is-past .cal-dn { color: var(--muted); }
    .cal-cell.is-today .cal-dn { color: var(--amber); }
    .cal-dn { font-size: 13px; font-weight: 700; }
    .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

    /* ══════════════════════════════════════════
       DAY SHEET
    ══════════════════════════════════════════ */
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; }
    #overlay.open { display: block; }
    #day-sheet {
      position: fixed; bottom: 0; left: 50%;
      transform: translateX(-50%) translateY(101%);
      width: 100%; max-width: 520px;
      background: var(--bg); border-radius: 22px 22px 0 0;
      border: 1.5px solid var(--border); border-bottom: none;
      z-index: 300; max-height: 82svh;
      display: flex; flex-direction: column;
      transition: transform .32s cubic-bezier(.32,.72,0,1);
      padding-bottom: calc(env(safe-area-inset-bottom,0px) + 8px);
    }
    #day-sheet.open { transform: translateX(-50%) translateY(0); }
    .sheet-handle { width: 38px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
    .sheet-head { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sheet-head-date { flex: 1; font-size: 16px; font-weight: 800; }
    .sheet-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 2px; line-height: 1; }
    #sheet-task-list { flex: 1; overflow-y: auto; padding: 10px 14px 4px; }
    .sheet-no-tasks { text-align: center; color: var(--muted); padding: 24px 0; font-size: 14px; }
    #sheet-add-form { border-top: 1px solid var(--border); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .form-row { display: flex; gap: 8px; }
    .form-input {
      background: var(--surface); border: 2px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 15px;
      font-family: inherit; padding: 9px 12px; outline: none;
    }
    .form-input:focus { border-color: var(--amber); }
    #f-title { flex: 1; }
    #f-time  { width: 96px; flex-shrink: 0; }
    .cat-row { display: flex; gap: 5px; align-items: center; flex: 1; flex-wrap: wrap; }
    .cat-pill {
      padding: 5px 10px; border-radius: 20px; border: 2px solid transparent;
      font-size: 11px; font-weight: 800; cursor: pointer; font-family: inherit;
      transition: transform .12s, opacity .12s; opacity: .55;
    }
    .cat-pill.picked { border-color: white; opacity: 1; transform: scale(1.05); }
    html[data-theme="light"] .cat-pill.picked { border-color: #1a1000; }
    .form-save-btn {
      padding: 9px 18px; border-radius: 10px; border: none;
      background: var(--amber); color: #1a1000; font-size: 14px;
      font-weight: 800; font-family: inherit; cursor: pointer; flex-shrink: 0;
    }
    .form-save-btn:active { opacity: .8; }

    /* ── Long-press pulse ── */
    @keyframes lp-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
    .vt-bubble.lp-active { animation: lp-pulse .18s ease; border-color: var(--amber) !important; }

    /* ── Action sheet (long press menu) ── */
    #act-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:400; }
    #act-overlay.open { display:block; }
    #act-sheet {
      position:fixed; bottom:0; left:50%; transform:translateX(-50%) translateY(101%);
      width:100%; max-width:520px; background:var(--bg);
      border-radius:22px 22px 0 0; border:1.5px solid var(--border); border-bottom:none;
      z-index:500; padding:0 14px calc(env(safe-area-inset-bottom,0px)+16px);
      transition:transform .28s cubic-bezier(.32,.72,0,1);
    }
    #act-sheet.open { transform:translateX(-50%) translateY(0); }
    .act-title {
      font-size:14px; font-weight:800; color:var(--muted);
      padding:16px 0 10px; border-bottom:1px solid var(--border); margin-bottom:10px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .act-btn {
      display:flex; align-items:center; gap:12px; width:100%; padding:14px 4px;
      background:none; border:none; color:var(--text); font-size:16px; font-weight:700;
      font-family:inherit; cursor:pointer; border-bottom:1px solid var(--border);
    }
    .act-btn:last-child { border-bottom:none; }
    .act-btn:active { opacity:.7; }
    .act-btn.danger { color:var(--red); }
    .act-cancel { color:var(--muted) !important; font-weight:600 !important; }

    /* ── Edit sheet ── */
    #edit-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:400; }
    #edit-overlay.open { display:block; }
    #edit-sheet {
      position:fixed; bottom:0; left:50%; transform:translateX(-50%) translateY(101%);
      width:100%; max-width:520px; background:var(--bg);
      border-radius:22px 22px 0 0; border:1.5px solid var(--border); border-bottom:none;
      z-index:500; max-height:85svh; display:flex; flex-direction:column;
      transition:transform .28s cubic-bezier(.32,.72,0,1);
      padding-bottom:calc(env(safe-area-inset-bottom,0px)+8px);
    }
    #edit-sheet.open { transform:translateX(-50%) translateY(0); }
    #edit-body { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
    .edit-label { font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
    .edit-save-btn {
      width:100%; padding:13px; border-radius:12px; border:none;
      background:var(--amber); color:#1a1000; font-size:15px; font-weight:900;
      font-family:inherit; cursor:pointer; margin-top:4px;
    }
    .edit-save-btn:active { opacity:.8; }

    /* ── FAB ── */
    #fab {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom,0px) + 22px); right: 22px;
      width: 58px; height: 58px; border-radius: 50%; border: none;
      background: var(--amber); color: #1a1000; font-size: 30px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px rgba(245,158,11,.45); z-index: 100;
    }
    #fab:active { transform: scale(.93); }
  </style>
</head>
<body>

<div id="header">
  <div class="hrow">
    <h1>✨ Cindy Calendar</h1>
    <button class="hbtn" onclick="toggleTheme()">☀️</button>
  </div>
  <div class="tabs">
    <button class="tab" id="tab-vt"  onclick="showTab('visual')">🗂 Timeline</button>
    <button class="tab" id="tab-lst" onclick="showTab('list')">📋 List</button>
    <button class="tab" id="tab-cal" onclick="showTab('calendar')">📅 Calendar</button>
  </div>
  <div id="filter-bar"></div>
</div>

<!-- Visual timeline -->
<div id="visual-panel">
  <div id="vt-wrap"></div>
</div>
<div id="drag-preview"></div>

<!-- List timeline -->
<div id="list-panel"></div>

<!-- Calendar -->
<div id="calendar-panel"></div>

<!-- Day sheet -->
<div id="overlay" onclick="closeSheet()"></div>
<div id="day-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-head-date" id="sheet-date-label"></div>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
  </div>
  <div id="sheet-task-list"></div>
  <div id="sheet-add-form">
    <div class="form-row">
      <input class="form-input" id="f-title" placeholder="Add a reminder…"
             onkeydown="if(event.key==='Enter')saveTask()" />
      <input class="form-input" id="f-time" type="time" />
    </div>
    <div class="form-row">
      <div class="cat-row" id="cat-picker"></div>
      <button class="form-save-btn" onclick="saveTask()">＋ Add</button>
    </div>
  </div>
</div>

<!-- Action sheet (long press) -->
<div id="act-overlay" onclick="closeActSheet()"></div>
<div id="act-sheet">
  <div class="sheet-handle"></div>
  <div class="act-title" id="act-task-title"></div>
  <button class="act-btn" onclick="editFromAct()">✏️ Edit</button>
  <button class="act-btn danger" onclick="deleteFromAct()">🗑 Delete</button>
  <button class="act-btn act-cancel" onclick="closeActSheet()">✕ Cancel</button>
</div>

<!-- Edit sheet -->
<div id="edit-overlay" onclick="closeEditSheet()"></div>
<div id="edit-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-head-date">Edit Reminder</div>
    <button class="sheet-close" onclick="closeEditSheet()">✕</button>
  </div>
  <div id="edit-body">
    <div>
      <div class="edit-label">Title</div>
      <input class="form-input" id="e-title" placeholder="Reminder title…" style="width:100%" />
    </div>
    <div>
      <div class="edit-label">Date</div>
      <input class="form-input" id="e-date" type="date" style="width:100%" />
    </div>
    <div>
      <div class="edit-label">Time (optional)</div>
      <input class="form-input" id="e-time" type="time" style="width:100%" />
    </div>
    <div>
      <div class="edit-label">Deadline (optional)</div>
      <input class="form-input" id="e-deadline" type="date" style="width:100%" />
    </div>
    <div>
      <div class="edit-label">Category</div>
      <div class="cat-row" id="edit-cat-row" style="flex-wrap:wrap"></div>
    </div>
    <button class="edit-save-btn" onclick="saveEdit()">✓ Save Changes</button>
  </div>
</div>

<button id="fab" onclick="openSheet(todayStr())">＋</button>

<script>
  const FB  = 'https://parents-reminder-places-default-rtdb.asia-southeast1.firebasedatabase.app/cindy-calendar.json';
  const THEME_KEY = 'cc_theme';

  const CATS = {
    tts:     { label: 'TTS',       color: '#f59e0b' },
    personal:{ label: 'Personal',  color: '#3b82f6' },
    dadmum:  { label: 'Dad & Mum', color: '#22c55e' },
    josh:    { label: 'Josh',      color: '#a855f7' },
    other:   { label: 'Other',     color: '#64748b' },
  };

  function catColor(t) {
    return (CATS[t.category] || CATS[t.color] || CATS.other).color;
  }

  let tasks       = [];
  let hiddenCats  = new Set();
  let activeTab   = 'visual';
  let calYear     = new Date().getFullYear();
  let calMonth    = new Date().getMonth();
  let sheetDate   = null;
  let pickedCat   = 'personal';

  // ── Theme ──
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); localStorage.setItem(THEME_KEY, t); }
  function toggleTheme()  { applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); }
  applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

  // ── Date helpers ──
  function todayStr() { return new Date().toISOString().slice(0, 10); }

  function addDays(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function dayLabel(dateStr) {
    const today = todayStr();
    const tom   = addDays(today, 1);
    const yest  = addDays(today, -1);
    if (dateStr === today) return { text: 'TODAY',     cls: 'is-today' };
    if (dateStr === tom)   return { text: 'TOMORROW',  cls: '' };
    if (dateStr === yest)  return { text: 'YESTERDAY', cls: 'is-overdue' };
    const past = dateStr < today;
    const d    = new Date(dateStr + 'T00:00:00');
    const text = d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
    return { text, cls: past ? 'is-overdue' : '' };
  }

  function fmtFull(dateStr) {
    return new Date(dateStr + 'T00:00:00')
      .toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Firebase ──
  async function loadTasks() {
    try {
      const r = await fetch(FB + '?t=' + Date.now(), { cache: 'no-store' });
      const d = await r.json();
      tasks = Array.isArray(d) ? d : [];
    } catch { tasks = []; }
    sortTasks(); render();
  }

  async function pushTasks() {
    await fetch(FB, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tasks) });
  }

  function sortTasks() {
    tasks.sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      if (!a.time && !b.time) return 0;
      if (!a.time) return 1; if (!b.time) return -1;
      return a.time < b.time ? -1 : 1;
    });
  }

  // ── CRUD ──
  async function saveTask() {
    const title = document.getElementById('f-title').value.trim();
    if (!title || !sheetDate) return;
    const time = document.getElementById('f-time').value;
    tasks.push({ id: 't' + Date.now(), date: sheetDate, title, time: time || '', done: false, category: pickedCat });
    sortTasks();
    document.getElementById('f-title').value = '';
    document.getElementById('f-time').value = '';
    await pushTasks();
    renderSheet(sheetDate); render();
  }

  async function toggleDone(id) {
    const t = tasks.find(x => x.id === id);
    if (t) t.done = !t.done;
    await pushTasks();
    if (sheetDate) renderSheet(sheetDate);
    render();
  }

  async function deleteTask(id) {
    if (!confirm('Delete this reminder?')) return;
    tasks = tasks.filter(x => x.id !== id);
    await pushTasks();
    if (sheetDate) renderSheet(sheetDate);
    render();
  }

  // ── Countdown badge (always shown — uses deadline if set, else task date) ──
  function refDate(t)  { return t.deadline || t.date; }
  function daysLeft(t) { return Math.ceil((new Date(refDate(t)+'T00:00:00') - new Date(todayStr()+'T00:00:00')) / 86400000); }

  function cdBadge(t, cls_prefix = 'countdown-badge') {
    if (t.done) return `<div class="${cls_prefix} good">✓ Done</div>`;
    const d = daysLeft(t);
    if (d < 0)  return `<div class="${cls_prefix} urgent">⚠ Overdue ${Math.abs(d)}d</div>`;
    if (d === 0) return `<div class="${cls_prefix} urgent">⚠ Due TODAY</div>`;
    if (d === 1) return `<div class="${cls_prefix} urgent">🔴 1 day left</div>`;
    if (d <= 7)  return `<div class="${cls_prefix} urgent">🔴 ${d}d left</div>`;
    if (d <= 14) return `<div class="${cls_prefix} warning">🟡 ${d}d left</div>`;
    return `<div class="${cls_prefix} ok">🔵 ${d}d left</div>`;
  }

  // ── Task card for list view ──
  function fmtShort(dateStr) {
    return new Date(dateStr + 'T00:00:00')
      .toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }

  function taskCardHTML(t) {
    const col     = catColor(t);
    const catInfo = CATS[t.category] || CATS.other;
    return `<div class="task-card${t.done ? ' done-card' : ''}">
      <div class="task-color-bar" style="background:${col}"></div>
      <div class="task-info">
        <div class="task-time-lbl">
          ${fmtShort(t.date)}${t.time ? ' · ' + t.time : ''}
          <span style="margin-left:5px;background:${col}22;color:${col};border-radius:8px;padding:1px 6px;font-size:10px;font-weight:800">${catInfo.label}</span>
        </div>
        <div class="task-title-txt${t.done ? ' done-txt' : ''}">${escHtml(t.title)}</div>
        ${cdBadge(t)}
      </div>
      <button class="task-done-btn${t.done ? ' is-done' : ''}" onclick="toggleDone('${t.id}')">${t.done ? '✓' : ''}</button>
      <button class="task-del-btn" onclick="deleteTask('${t.id}')">×</button>
    </div>`;
  }

  // ══════════════════════════════════════════
  //  VISUAL TIMELINE
  // ══════════════════════════════════════════
  const PDAY     = 95;  // pixels per day
  const PAD_TOP  = 60;
  const PAD_BOT  = 80;

  let dragState = null;

  function renderVisual() {
    const wrap  = document.getElementById('vt-wrap');
    const today = todayStr();

    // Only show incomplete tasks (overdue included) and done tasks from today only
    const visible = visibleTasks(tasks.filter(t =>
      (!t.done && t.date >= addDays(today, -3)) ||
      (t.done && t.date === today)
    ));

    if (!visible.length) {
      wrap.style.height = '';
      wrap.innerHTML = `<div class="vt-empty">
        <span class="vt-empty-icon">🎉</span>
        Nothing on the list!<br>Tap ＋ to add a reminder.
      </div>`;
      return;
    }

    // Sort ASC by days left (fewest first = top)
    visible.sort((a, b) => daysLeft(a) - daysLeft(b) || a.date.localeCompare(b.date));

    // ── Even spacing — no empty stretches ──
    const ITEM_GAP  = 110; // px between each task
    const DOT_Y_OFF = 22;  // dot sits ~midway down the bubble

    // Assign a Y position to every task sequentially
    const taskY = {};
    visible.forEach((t, i) => { taskY[t.id] = PAD_TOP + i * ITEM_GAP; });

    const lineTop    = PAD_TOP + DOT_Y_OFF;
    const lineBot    = PAD_TOP + (visible.length - 1) * ITEM_GAP + DOT_Y_OFF;
    const containerH = lineBot + PAD_BOT;

    // Date markers — one dot per unique reference date (at the first task of that date)
    const seenRef = new Set();
    let dotsH = '';
    visible.forEach(t => {
      const rd = refDate(t);
      if (seenRef.has(rd)) return;
      seenRef.add(rd);
      const y = taskY[t.id] + DOT_Y_OFF;
      const { text, cls } = dayLabel(rd);
      const isToday = rd === today;
      dotsH += `<div class="vt-dot${isToday ? ' is-today' : ''}" style="top:${y}px"></div>
                <div class="vt-lbl ${cls}" style="top:${y - 20}px">${text}</div>`;
    });

    // Bubbles
    let bubbH = '';
    let sideN = 0;
    visible.forEach(t => {
      const side      = sideN % 2 === 0 ? 'right' : 'left';
      sideN++;
      const y         = taskY[t.id];
      const col       = catColor(t);
      const catInfo   = CATS[t.category] || CATS.other;
      const badge     = cdBadge(t, 'vt-badge');
      const dispDate  = fmtShort(refDate(t));
      const hasDeadline = !!t.deadline;

      bubbH += `<div class="vt-bubble ${side}${t.done ? ' done-card' : ''}"
          data-id="${t.id}" data-ref="${refDate(t)}" data-base-top="${y}"
          style="top:${y}px"
          onmousedown="startDrag(event,'${t.id}')"
          ontouchstart="startDrag(event,'${t.id}')">
        <div class="vt-bar" style="background:${col}"></div>
        <div class="vt-body">
          <div class="vt-title">${escHtml(t.title)}</div>
          <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;align-items:center">
            <span style="font-size:10px;font-weight:700;color:var(--muted)">${hasDeadline ? '⏰ ' : ''}${dispDate}</span>
            <span style="background:${col}22;color:${col};border-radius:8px;padding:1px 6px;font-size:10px;font-weight:800">${catInfo.label}</span>
          </div>
          ${badge}
        </div>
        <div class="vt-grip">⋮⋮</div>
      </div>`;
    });

    wrap.style.height = containerH + 'px';
    // Line only spans from first to last bubble — no empty stretches
    wrap.innerHTML = `<div class="vt-line" style="top:${lineTop}px;height:${lineBot-lineTop}px"></div>${dotsH}${bubbH}`;
  }

  // ── Bubble interaction: tap / long-press / drag ──
  function startDrag(e, taskId) {
    e.preventDefault();
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;

    const el      = document.querySelector(`.vt-bubble[data-id="${taskId}"]`);
    if (!el) return;
    const baseTop = parseFloat(el.dataset.baseTop);
    const origRef = el.dataset.ref || task.date;
    const startY  = e.touches ? e.touches[0].clientY : e.clientY;
    const startX  = e.touches ? e.touches[0].clientX : e.clientX;
    const preview = document.getElementById('drag-preview');

    let phase = 'pending'; // 'pending' | 'drag' | 'longpress'

    const lpTimer = setTimeout(() => {
      if (phase !== 'pending') return;
      phase = 'longpress';
      if (navigator.vibrate) navigator.vibrate(45);
      el.classList.add('lp-active');
      setTimeout(() => el.classList.remove('lp-active'), 250);
      cleanup();
      showActSheet(taskId);
    }, 480);

    function onMove(ev) {
      ev.preventDefault();
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;

      if (phase === 'pending') {
        if (Math.abs(cx - startX) > 7 || Math.abs(cy - startY) > 7) {
          clearTimeout(lpTimer);
          phase = 'drag';
          dragState = { taskId, origRef, startY, el, baseTop };
          el.classList.add('vt-dragging');
          preview.style.display = 'block';
          preview.textContent = fmtFull(origRef);
        }
        return;
      }

      if (phase === 'drag') {
        const dy    = cy - dragState.startY;
        dragState.el.style.top = (dragState.baseTop + dy) + 'px';
        const delta = Math.round(dy / PDAY);
        let   prev  = addDays(dragState.origRef, delta);
        if (prev < todayStr()) prev = todayStr();
        preview.textContent = fmtFull(prev);
      }
    }

    async function onEnd(ev) {
      clearTimeout(lpTimer);

      if (phase === 'pending') {
        // Quick tap → open day sheet
        cleanup();
        openSheet(task.date);
        return;
      }

      if (phase === 'drag' && dragState) {
        const cy    = ev.changedTouches ? ev.changedTouches[0].clientY : ev.clientY;
        const dy    = cy - dragState.startY;
        const delta = Math.round(dy / PDAY);
        let newRef  = addDays(dragState.origRef, delta);
        if (newRef < todayStr()) newRef = todayStr();

        preview.style.display = 'none';
        dragState.el.classList.remove('vt-dragging');

        if (newRef !== dragState.origRef) {
          const t = tasks.find(x => x.id === dragState.taskId);
          if (t) {
            if (t.deadline) {
              t.deadline = newRef;
              t.date     = addDays(t.date, delta);
              if (t.date < todayStr()) t.date = todayStr();
            } else {
              t.date = newRef;
            }
            sortTasks(); await pushTasks();
          }
        }
        dragState = null;
        render();
      }

      cleanup();
    }

    function cleanup() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup',   onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend',  onEnd);
    }

    document.addEventListener('mousemove', onMove, { passive: false });
    document.addEventListener('mouseup',   onEnd);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend',  onEnd);
  }

  // ── Action sheet ──
  let actTaskId = null;

  function showActSheet(taskId) {
    actTaskId = taskId;
    const task = tasks.find(t => t.id === taskId);
    document.getElementById('act-task-title').textContent = task ? task.title : '';
    document.getElementById('act-overlay').classList.add('open');
    document.getElementById('act-sheet').classList.add('open');
  }

  function closeActSheet() {
    actTaskId = null;
    document.getElementById('act-overlay').classList.remove('open');
    document.getElementById('act-sheet').classList.remove('open');
  }

  function editFromAct() {
    const id = actTaskId;
    closeActSheet();
    openEditSheet(id);
  }

  async function deleteFromAct() {
    const id = actTaskId;
    closeActSheet();
    if (!confirm('Delete this reminder?')) return;
    tasks = tasks.filter(x => x.id !== id);
    await pushTasks();
    render();
  }

  // ── Edit sheet ──
  let editingId = null;
  let editCat   = 'personal';

  function openEditSheet(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    editingId = taskId;
    editCat   = task.category || 'other';

    document.getElementById('e-title').value    = task.title;
    document.getElementById('e-date').value     = task.date;
    document.getElementById('e-time').value     = task.time || '';
    document.getElementById('e-deadline').value = task.deadline || '';
    renderEditCats();

    document.getElementById('edit-overlay').classList.add('open');
    document.getElementById('edit-sheet').classList.add('open');
    setTimeout(() => document.getElementById('e-title').focus(), 320);
  }

  function closeEditSheet() {
    editingId = null;
    document.getElementById('edit-overlay').classList.remove('open');
    document.getElementById('edit-sheet').classList.remove('open');
  }

  function renderEditCats() {
    document.getElementById('edit-cat-row').innerHTML = Object.entries(CATS).map(([key, cat]) =>
      `<button class="cat-pill${editCat === key ? ' picked' : ''}"
        style="background:${cat.color}33;color:${cat.color};border-color:${editCat===key?cat.color:'transparent'}"
        onclick="editCat='${key}';renderEditCats()">${cat.label}</button>`
    ).join('');
  }

  async function saveEdit() {
    const title    = document.getElementById('e-title').value.trim();
    const date     = document.getElementById('e-date').value;
    const time     = document.getElementById('e-time').value;
    const deadline = document.getElementById('e-deadline').value;
    if (!title || !date) { alert('Title and date are required'); return; }

    const task = tasks.find(t => t.id === editingId);
    if (!task) return;
    task.title    = title;
    task.date     = date;
    task.time     = time;
    task.deadline = deadline || undefined;
    task.category = editCat;

    sortTasks();
    await pushTasks();
    closeEditSheet();
    render();
  }

  // ══════════════════════════════════════════
  //  LIST TIMELINE
  // ══════════════════════════════════════════
  function renderList() {
    const el    = document.getElementById('list-panel');
    const today = todayStr();
    const cutoff = addDays(today, -7);
    const ahead  = addDays(today, 90);

    const grouped = {};
    visibleTasks(tasks).forEach(t => {
      if (t.date < cutoff || t.date > ahead) return;
      if (t.date < today && t.done) return;
      (grouped[t.date] = grouped[t.date] || []).push(t);
    });

    const dates = Object.keys(grouped).sort();
    if (!dates.length) {
      el.innerHTML = `<div class="tl-empty"><span class="tl-empty-icon">📅</span>No upcoming reminders<br>Tap ＋ to add one!</div>`;
      return;
    }

    el.innerHTML = dates.map(date => {
      const { text, cls } = dayLabel(date);
      const d   = new Date(date + 'T00:00:00');
      const sub = d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
      const lbl = (cls === 'is-today' || text === 'TOMORROW') ? `${text} · ${sub}` :
                  cls === 'is-overdue' ? `⚠ ${text} · ${sub}` : `${text} · ${sub}`;
      return `<div class="tl-day">
        <div class="tl-day-header">
          <span class="tl-day-label ${cls}">${lbl}</span>
          <div class="tl-day-line"></div>
          <button class="tl-add-btn" onclick="openSheet('${date}')">＋</button>
        </div>
        ${grouped[date].map(taskCardHTML).join('')}
      </div>`;
    }).join('');
  }

  // ══════════════════════════════════════════
  //  CALENDAR
  // ══════════════════════════════════════════
  function renderCalendar() {
    const el    = document.getElementById('calendar-panel');
    const today = todayStr();
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DOW   = ['M','T','W','T','F','S','S'];

    const firstDow = new Date(calYear, calMonth, 1).getDay();
    const offset   = (firstDow + 6) % 7;
    const daysInM  = new Date(calYear, calMonth + 1, 0).getDate();
    const mk       = `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;

    const byDate = {};
    visibleTasks(tasks.filter(t => t.date.startsWith(mk))).forEach(t => {
      (byDate[t.date] = byDate[t.date] || []).push(t);
    });

    const cells = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('') +
      Array(offset).fill('<div class="cal-cell empty"></div>').join('') +
      Array.from({ length: daysInM }, (_, i) => {
        const d  = i + 1;
        const ds = `${mk}-${String(d).padStart(2, '0')}`;
        const isT = ds === today, isP = ds < today;
        const dots = (byDate[ds] || []).slice(0, 4)
          .map(t => `<div class="cal-dot" style="background:${catColor(t)}"></div>`).join('');
        return `<div class="cal-cell${isT ? ' is-today' : isP ? ' is-past' : ''}" onclick="openSheet('${ds}')">
          <span class="cal-dn">${d}</span>
          <div class="cal-dots">${dots}</div>
        </div>`;
      }).join('');

    el.innerHTML = `<div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrev()">◀</button>
      <h2>${MONTHS[calMonth]} ${calYear}</h2>
      <button class="cal-nav-btn" onclick="calNext()">▶</button>
    </div><div class="cal-grid">${cells}</div>`;
  }

  // ── Dispatch render ──
  function render() {
    if (activeTab === 'visual')    renderVisual();
    else if (activeTab === 'list') renderList();
    else                           renderCalendar();
  }

  // ── Tabs ──
  function showTab(tab) {
    activeTab = tab;
    document.getElementById('tab-vt').classList.toggle('active', tab === 'visual');
    document.getElementById('tab-lst').classList.toggle('active', tab === 'list');
    document.getElementById('tab-cal').classList.toggle('active', tab === 'calendar');
    document.getElementById('visual-panel').style.display   = tab === 'visual'   ? 'block' : 'none';
    document.getElementById('list-panel').style.display     = tab === 'list'     ? 'block' : 'none';
    document.getElementById('calendar-panel').style.display = tab === 'calendar' ? 'block' : 'none';
    render();
  }

  function calPrev() { if (--calMonth < 0)  { calMonth = 11; calYear--; } renderCalendar(); }
  function calNext() { if (++calMonth > 11) { calMonth = 0;  calYear++; } renderCalendar(); }

  // ── Day sheet ──
  function openSheet(dateStr) {
    sheetDate = dateStr;
    document.getElementById('sheet-date-label').textContent = fmtFull(dateStr);
    document.getElementById('f-title').value = '';
    document.getElementById('f-time').value  = '';
    renderCatPicker();
    renderSheet(dateStr);
    document.getElementById('overlay').classList.add('open');
    document.getElementById('day-sheet').classList.add('open');
    setTimeout(() => document.getElementById('f-title').focus(), 350);
  }

  function closeSheet() {
    sheetDate = null;
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('day-sheet').classList.remove('open');
  }

  function renderSheet(dateStr) {
    const el       = document.getElementById('sheet-task-list');
    const dayTasks = tasks.filter(t => t.date === dateStr);
    el.innerHTML   = dayTasks.length
      ? dayTasks.map(taskCardHTML).join('')
      : '<div class="sheet-no-tasks">No reminders — add one below</div>';
  }

  // ── Category filter bar ──
  function renderFilters() {
    const allHidden = hiddenCats.size === 0;
    document.getElementById('filter-bar').innerHTML =
      `<button class="fp-all${allHidden ? ' active' : ''}" onclick="showAllCats()">All</button>` +
      Object.entries(CATS).map(([key, cat]) => {
        const off = hiddenCats.has(key) ? ' off' : '';
        return `<button class="fp${off}"
          style="background:${cat.color}22;color:${cat.color};border-color:${off?'transparent':cat.color}"
          onclick="toggleFilter('${key}')">${cat.label}</button>`;
      }).join('');
  }

  function toggleFilter(key) {
    if (hiddenCats.has(key)) hiddenCats.delete(key);
    else hiddenCats.add(key);
    renderFilters();
    render();
  }

  function showAllCats() {
    hiddenCats.clear();
    renderFilters();
    render();
  }

  function visibleTasks(arr) {
    return hiddenCats.size === 0 ? arr
      : arr.filter(t => !hiddenCats.has(t.category || 'other'));
  }

  function renderCatPicker() {
    document.getElementById('cat-picker').innerHTML = Object.entries(CATS).map(([key, cat]) =>
      `<button class="cat-pill${pickedCat === key ? ' picked' : ''}"
        style="background:${cat.color}33;color:${cat.color};border-color:${pickedCat===key?cat.color:'transparent'}"
        onclick="pickCat('${key}')">${cat.label}</button>`
    ).join('');
  }

  function pickCat(key) { pickedCat = key; renderCatPicker(); }

  // ── Init ──
  renderFilters();
  showTab('visual');
  loadTasks();
</script>
</body>
</html>
